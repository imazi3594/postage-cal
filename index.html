<html lang="zh-Hant-HK">
<head>

  <script>try{if(localStorage.getItem("stamp-calc-theme")==="dark"){document.documentElement.classList.add("dark");document.documentElement.style.colorScheme="dark"}}catch(e){}
  window.addEventListener("beforeinstallprompt",function(e){e.preventDefault();window.__pwaDeferred=e;});

  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+HK:wght@400;500;600;700&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #e8f8ed;
      --surface: #f4fdf7;
      --surface-2: #d4f1de;
      --ink: #123326;
      --muted: #3d7a57;
      --subtle: #5b9472;
      --primary: #009247;
      --primary-fg: #f4fdf7;
      --primary-soft: #c2efd3;
      --border: #addcbe;
      --shadow: 0 0 0 1px rgb(21 36 28 / 0.06), 0 1px 2px -1px rgb(21 36 28 / 0.06), 0 2px 8px rgb(21 36 28 / 0.04);
      --ease: cubic-bezier(0.22, 1, 0.36, 1);
      --sans: "Noto Sans HK", "PingFang HK", "Noto Sans TC", ui-sans-serif, system-ui, sans-serif;
      --display: "Outfit", "Noto Sans HK", "PingFang HK", ui-sans-serif, sans-serif;
    }
    html.dark {
      color-scheme: dark;
      --bg: #121a16;
      --surface: #1b2620;
      --surface-2: #25332c;
      --ink: #e8f0ea;
      --muted: #9aada2;
      --subtle: #7d9086;
      --primary: #5dca9a;
      --primary-fg: #102018;
      --primary-soft: #1e3a2e;
      --border: #33463c;
      --shadow: 0 0 0 1px rgb(232 240 234 / 0.08), 0 1px 2px -1px rgb(0 0 0 / 0.45), 0 2px 10px rgb(0 0 0 / 0.28);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100dvh; background: var(--bg); color: var(--ink); font-family: var(--sans); -webkit-font-smoothing: antialiased; }
    button, [role="button"] { cursor: pointer; font-family: inherit; }
    button:disabled { cursor: default; }
    a { color: inherit; text-decoration: none; }
    .wrap { width: min(32rem, 100%); height: 100dvh; margin: 0 auto; padding: 0.75rem 1rem 1rem; display: flex; flex-direction: column; gap: 0.75rem; overflow: hidden; }
    .wrap.settings { height: auto; min-height: 100dvh; overflow: auto; padding-bottom: 2rem; }
    .top { display: flex; align-items: center; justify-content: space-between; gap: 0.75rem; }
    .mark { margin: 0; font-family: var(--display); font-size: 0.625rem; font-weight: 500; letter-spacing: 0.04em; color: var(--primary); }
    h1 { margin: 0.125rem 0 0; display: flex; align-items: center; gap: 0.375rem; font-size: 1.125rem; font-weight: 600; letter-spacing: -0.02em; color: var(--ink); }
    h1 svg { color: var(--primary); flex: 0 0 auto; }
    .icon-btn { flex: 0 0 auto; width: 2.5rem; height: 2.5rem; display: inline-flex; align-items: center; justify-content: center; border: 0; border-radius: 0.5rem; background: transparent; color: var(--ink); }
    .icon-btn:hover { background: var(--surface-2); }
    .icon-row { display: flex; align-items: center; flex: 0 0 auto; }
    .icon-sun { display: none; }
    html.dark .icon-sun { display: block; }
    html.dark .icon-moon { display: none; }
    .card { background: var(--surface); border-radius: 1.25rem; padding: 0.75rem; box-shadow: var(--shadow); }
    .combo { height: 6rem; display: flex; align-items: center; justify-content: center; overflow: hidden; }
    .combo p { margin: 0; padding: 0 1rem; text-align: center; font-size: 0.875rem; color: var(--muted); }
    .combo-stats { margin: 0.25rem 0 0; min-height: 1rem; text-align: center; font-size: 0.75rem; color: var(--muted); }
    .cluster { display: flex; align-items: center; justify-content: center; gap: 0.25rem; width: max-content; flex-shrink: 0; padding: 0.25rem; transform-origin: center; }
    .amount-row { display: flex; align-items: center; gap: 0.5rem; background: var(--bg); border-radius: 0.75rem; padding: 0.5rem 0.75rem; }
    .amount-row .label { margin: 0; font-size: 0.75rem; font-weight: 500; color: var(--muted); }
    .amount-row .value { margin: 0.125rem 0 0; font-family: var(--display); font-size: 1.875rem; font-weight: 600; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .amount-row .value span { margin-right: 0.25rem; color: var(--subtle); }
    .back-btn { width: 3rem; height: 3rem; display: inline-flex; align-items: center; justify-content: center; border: 0; border-radius: 0.5rem; background: var(--surface-2); color: var(--ink); flex: 0 0 auto; touch-action: manipulation; }
    .back-btn svg { width: 1.75rem; height: 1.75rem; display: block; }
    .back-btn:hover { background: var(--border); }
    .keys { margin-top: 0.5rem; display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.5rem; }
    .keys button { height: 3rem; border: 0; border-radius: 0.5rem; background: var(--surface-2); color: var(--ink); font-family: var(--display); font-size: 1.5rem; font-variant-numeric: tabular-nums; touch-action: manipulation; }
    .keys button:hover { background: var(--border); }
    .keys .clear { background: var(--primary-soft); color: #14553b; }
    .keys .clear:hover { background: color-mix(in oklab, var(--primary) 15%, var(--primary-soft)); }
    .head-row { display: flex; flex-wrap: nowrap; align-items: flex-start; justify-content: space-between; gap: 0.75rem; }
    .head-row > div { min-width: 0; flex: 1; }
    .head-row .btn { flex-shrink: 0; }
    h2 { margin: 0; font-size: 1.25rem; font-weight: 600; }
    .hint { margin: 0.25rem 0 0; font-size: 0.875rem; color: var(--muted); }
    .actions { display: flex; gap: 0.5rem; }
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem; height: 2.25rem; padding: 0 0.75rem; border: 1px solid var(--border); border-radius: 0.5rem; font-size: 0.875rem; font-weight: 500; background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
    .btn:hover { background: var(--surface-2); }
    .btn.ghost { box-shadow: none; }
    .btn.secondary { height: 2.75rem; padding: 0 1rem; background: var(--surface-2); box-shadow: none; }
    .grid { margin-top: 1rem; display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.5rem; }
    .grid button { border: 0; background: transparent; padding: 0; touch-action: manipulation; border-radius: 0.25rem; overflow: visible; position: relative; }
    #extra-grid { gap: 0.75rem; overflow: visible; }
    .custom-form { margin-top: 1rem; display: flex; flex-direction: column; gap: 0.5rem; }
    @media (min-width: 640px) { .custom-form { flex-direction: row; } }
    .custom-form input { height: 2.75rem; width: 100%; max-width: 14rem; border: 0; border-radius: 0.5rem; padding: 0 0.75rem; background: var(--bg); color: var(--ink); font: inherit; box-shadow: var(--shadow); }
    .stamp { position: relative; width: 5rem; }
    .grid .stamp { width: 100%; }
    .stamp-face {
      --hue: 152;
      --paper: oklch(0.93 0.09 var(--hue));
      --ink-s: oklch(0.36 0.13 var(--hue));
      --hole: var(--surface);
      --sparkle: 0deg;
      position: relative; isolation: isolate; display: flex; height: 4rem; align-items: center; justify-content: center;
      overflow: hidden; padding: 0 0.35rem; color: var(--ink-s); background: var(--paper);
    }
    .stamp-face.sm { height: 3.5rem; padding: 0 0.2rem; }
    .stamp-face.xs { height: 2.5rem; padding: 0 0.15rem; }
    .stamp-face.xs span { font-size: 0.875rem; }
    .stamp.xs { width: 3.5rem; }
    .stock { display: none; width: 100%; padding: 0.5rem 0.75rem; border: 0; text-align: left; font: inherit; color: inherit; cursor: pointer; overflow: hidden; }
    .stock.show { display: block; }
    .stock-row { display: flex; align-items: baseline; min-width: 0; font-size: 0.875rem; font-weight: 500; line-height: 1.4; white-space: nowrap; }
    .stock-row + .stock-row { margin-top: 0.125rem; }
    .stock-row.oos { color: #dc2626; }
    .stock-row.custom { color: #2563eb; }
    .stock-label { flex: 0 0 auto; }
    .stock-marquee { flex: 1 1 auto; min-width: 0; overflow: hidden; white-space: nowrap; line-height: 1.4; }
    .stock-marquee-inner { display: inline-flex; width: max-content; }
    .stock-marquee-inner span { flex-shrink: 0; }
    .marquee-track { animation: stock-marquee linear infinite; }
    .marquee-track span { padding-right: 2.5rem; }
    @keyframes stock-marquee { from { transform: translateX(0); } to { transform: translateX(-50%); } }
    .stamp-face.off { opacity: 0.38; filter: grayscale(0.8); }
    .oos-tag {
      position: absolute; top: 0.2rem; right: -0.2rem; z-index: 12;
      padding: 0.18rem 0.4rem; border-radius: 0.2rem; background: #dc2626; color: #fff;
      font-family: var(--sans); font-size: 0.625rem; font-weight: 700; letter-spacing: 0.06em; line-height: 1;
      white-space: nowrap; transform: rotate(28deg); box-shadow: 0 1px 3px rgb(127 29 29 / 0.35); pointer-events: none;
    }
    .stamp.xs .oos-tag { top: 0.05rem; right: -0.25rem; font-size: 0.5rem; padding: 0.12rem 0.28rem; }
    .stamp-face[data-tone="0"] { --hue: 18; } .stamp-face[data-tone="1"] { --hue: 40; }
    .stamp-face[data-tone="2"] { --hue: 62; } .stamp-face[data-tone="3"] { --hue: 85; }
    .stamp-face[data-tone="4"] { --hue: 108; } .stamp-face[data-tone="5"] { --hue: 130; }
    .stamp-face[data-tone="6"] { --hue: 152; } .stamp-face[data-tone="7"] { --hue: 175; }
    .stamp-face[data-tone="8"] { --hue: 198; } .stamp-face[data-tone="9"] { --hue: 220; }
    .stamp-face[data-tone="10"] { --hue: 242; } .stamp-face[data-tone="11"] { --hue: 265; }
    .stamp-face[data-tone="12"] { --hue: 288; } .stamp-face[data-tone="13"] { --hue: 310; }
    .stamp-face[data-tone="14"] { --hue: 332; } .stamp-face[data-tone="15"] { --hue: 355; }
    .stamp-face.custom { --paper: oklch(0.92 0.11 var(--hue)); --ink-s: #1d4ed8; box-shadow: 0 0 10px rgb(255 196 80 / 0.4); }
    .stamp-face span { position: relative; z-index: 1; font-family: var(--display); font-weight: 600; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; line-height: 1; font-size: 1.25rem; }
    .stamp-face.sm span { font-size: 1.125rem; }
    .stamp-face::before {
      content: ""; position: absolute; inset: 0; pointer-events: none;
      background-image:
        radial-gradient(circle at 50% 0, var(--hole) 2.5px, transparent 2.8px),
        radial-gradient(circle at 50% 100%, var(--hole) 2.5px, transparent 2.8px),
        radial-gradient(circle at 0 50%, var(--hole) 2.5px, transparent 2.8px),
        radial-gradient(circle at 100% 50%, var(--hole) 2.5px, transparent 2.8px);
      background-size: 8px 8px;
      background-position: 0 0, 0 100%, 0 0, 100% 0;
      background-repeat: round no-repeat, round no-repeat, no-repeat round, no-repeat round;
    }
    .stamp-face::after {
      content: ""; position: absolute; inset: 6px; pointer-events: none;
      border: 1px solid color-mix(in oklab, var(--ink-s) 38%, transparent);
    }
    @property --sparkle { syntax: "<angle>"; inherits: false; initial-value: 0deg; }
    .stamp-face.custom::after {
      inset: 4px; border: 2px solid transparent;
      background:
        linear-gradient(var(--paper), var(--paper)) padding-box,
        conic-gradient(from var(--sparkle), #ffd36a 0deg, #fff4c2 45deg, #ff8acb 90deg, #8ec5ff 140deg, #7dffc4 190deg, #ffe36a 250deg, #ffb347 300deg, #ffd36a 360deg) border-box;
      background-origin: border-box; background-clip: padding-box, border-box;
      box-shadow: inset 0 0 6px rgb(255 214 120 / 0.45), 0 0 6px rgb(255 196 80 / 0.4);
      animation: stamp-rainbow-gold 2.2s linear infinite;
    }
    @keyframes stamp-rainbow-gold { to { --sparkle: 360deg; } }
    .badge {
      position: absolute; top: 0; right: 0; z-index: 2; min-width: 1.75rem; height: 1.75rem; padding: 0 0.375rem;
      display: flex; align-items: center; justify-content: center; border-radius: 999px; background: var(--primary); color: var(--primary-fg);
      font-family: var(--display); font-size: 0.75rem; font-weight: 600; font-variant-numeric: tabular-nums;
    }
    .badge.remove {
      top: -0.5rem; right: -0.5rem; left: auto;
      width: 1.15rem; min-width: 1.15rem; height: 1.15rem; padding: 0;
      background: #dc2626; color: #fff; font-size: 0.85rem; line-height: 1; font-weight: 700;
      box-shadow: 0 0 0 2px var(--surface);
    }
    .toast-host { pointer-events: none; position: fixed; inset: 1rem 1rem auto; z-index: 20; display: flex; justify-content: center; opacity: 0; transform: translateY(-0.5rem); transition: opacity 250ms var(--ease), transform 250ms var(--ease); }
    .toast-host.show { opacity: 1; transform: none; }
    .toast { display: flex; align-items: center; gap: 0.75rem; width: min(24rem, 100%); border-radius: 1rem; background: #fca5a5; color: #7f1d1d; padding: 0.9rem 1.25rem; box-shadow: var(--shadow); }
    .toast .bang { flex-shrink: 0; width: 1.5rem; height: 1.5rem; }
    .toast .msg { margin: 0; font-size: 1.125rem; font-weight: 600; }
    .hidden { display: none !important; }
    .install-btn { display: none; height: 2.5rem; border: 0; border-radius: 0.75rem; background: var(--primary); color: var(--primary-fg); font: inherit; font-size: 0.875rem; font-weight: 600; box-shadow: var(--shadow); align-items: center; justify-content: center; gap: 0.4rem; flex: 0 0 auto; }
    .install-btn.show { display: flex; }
    .install-btn:disabled { opacity: 0.7; }
    .install-sheet { pointer-events: none; position: fixed; inset: 1rem 1rem auto; z-index: 21; display: none; justify-content: center; }
    .install-sheet.show { display: flex; pointer-events: auto; }
    .install-card { position: relative; width: min(24rem, 100%); border-radius: 1rem; background: var(--surface); color: var(--ink); padding: 1rem 1.25rem; box-shadow: var(--shadow); }
    .install-card h3 { margin: 0 1.5rem 0 0; font-size: 1rem; font-weight: 600; }
    .install-card ol { margin: 0.5rem 0 0; padding-left: 1.25rem; font-size: 0.875rem; color: var(--muted); }
    .install-card li { margin: 0.25rem 0; }
    .install-close { position: absolute; top: 0.4rem; right: 0.4rem; width: 2rem; height: 2rem; border: 0; border-radius: 0.5rem; background: transparent; color: var(--muted); }
    @media (prefers-reduced-motion: reduce) {
      .stamp-face.custom::after { animation: none; }
      .toast-host { transition: none; }
      .marquee-track { animation: none; }
    }
  </style>
</head>
<body>
  <div id="home" class="wrap">
    <header class="top">
      <div>
        <p class="mark">Postage combination calculator</p>
        <h1>
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><rect x="6.5" y="7.5" width="11" height="9" rx="1"/></svg>
          郵票組合計數機
        </h1>
      </div>
      <div class="icon-row">
        <button type="button" class="icon-btn" id="theme-btn" aria-label="轉深色">
          <svg class="icon-moon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
          <svg class="icon-sun" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>
        </button>
        <button type="button" class="icon-btn" data-go="settings" aria-label="設定">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>
    </header>
    <div>
      <section class="card" aria-live="polite"><div id="combo" class="combo"></div></section>
      <p id="combo-stats" class="combo-stats">&nbsp;</p>
    </div>
    <button type="button" id="stock" class="card stock" data-go="settings" aria-label="設定郵票面額">
      <div id="stock-cluster"></div>
    </button>
    <section class="card pad">
      <div class="amount-row">
        <div style="flex:1;min-width:0">
          <p class="label">郵費</p>
          <p class="value"><span>$</span><b id="amount">0</b></p>
        </div>
        <button type="button" class="back-btn" data-key="back" aria-label="刪除一位">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M10 5a2 2 0 0 0-1.344.519l-6.328 5.74a1 1 0 0 0 0 1.481l6.328 5.741A2 2 0 0 0 10 19h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2z"/>
            <path d="m12 9 6 6"/>
            <path d="m18 9-6 6"/>
          </svg>
        </button>
      </div>
      <div class="keys">
        <button type="button" data-key="7">7</button>
        <button type="button" data-key="8">8</button>
        <button type="button" data-key="9">9</button>
        <button type="button" data-key="4">4</button>
        <button type="button" data-key="5">5</button>
        <button type="button" data-key="6">6</button>
        <button type="button" data-key="1">1</button>
        <button type="button" data-key="2">2</button>
        <button type="button" data-key="3">3</button>
        <button type="button" class="clear" data-key="C">C</button>
        <button type="button" data-key="0">0</button>
        <button type="button" data-key=".">.</button>
      </div>
    </section>
    <button type="button" id="install-btn" class="install-btn">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 17V3"/><path d="m6 11 6 6 6-6"/><path d="M19 21H5"/></svg>
      一鍵加到桌面
    </button>
  </div>

  <div id="settings" class="wrap settings hidden">
    <header class="top">
      <button type="button" class="icon-btn" data-go="home" aria-label="返回計數機">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
      </button>
      <div style="flex:1">
        <p class="mark">Postage combination calculator</p>
        <h1>設定</h1>
        <p class="hint">揀計數機用邊啲郵票面額。</p>
      </div>
    </header>
    <section class="card" style="padding:1.25rem">
      <div class="head-row">
        <div>
          <h2>通用郵票庫存</h2>
          <p class="hint">點擊以切換庫存狀態</p>
        </div>
        <button type="button" class="btn" id="reset">重設</button>
      </div>
      <div id="denom-grid" class="grid"></div>
    </section>
    <section class="card" style="padding:1.25rem">
      <div class="head-row">
        <div>
          <h2>自訂面額</h2>
          <p class="hint">加入自訂面額郵票或特別郵票</p>
        </div>
        <button type="button" class="btn" id="reset-extras">重設</button>
      </div>
      <div id="extra-grid" class="grid"></div>
      <form id="custom-form" class="custom-form">
        <input id="custom-input" inputmode="decimal" placeholder="例如 2.4，上限 $50" aria-label="自訂郵票面額" />
        <button type="submit" class="btn secondary">加入面額</button>
      </form>
    </section>
  </div>

  <div id="install-sheet" class="install-sheet">
    <div class="install-card" role="dialog" aria-label="加到主畫面">
      <button type="button" class="install-close" id="install-close" aria-label="關閉">×</button>
      <h3>加到主畫面，當 app 用</h3>
      <ol id="install-steps"></ol>
    </div>
  </div>

  <div id="toast" class="toast-host" aria-hidden="true">
    <div class="toast" role="alert">
      <svg class="bang" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 8v4"/><path d="M12 16h.01"/></svg>
      <p class="msg" id="toast-msg">&nbsp;</p>
    </div>
  </div>

  <script>
    const DEFAULT_DOLLARS = [0.1, 0.2, 0.5, 1, 2, 2.2, 2.8, 3.7, 4, 5, 5.4, 5.5, 10, 15.5, 20, 50];
    const DEFAULT_CENTS = DEFAULT_DOLLARS.map(dollarsToCents);
    const MAX_AMOUNT = 9999.9;
    const MAX_CUSTOM = 50;
    const MAX_LABEL = "$9999.9";
    const INF = 0x3f3f3f3f;
    const STORAGE_KEY = "stamp-calc-v2";

    function dollarsToCents(n) { return Math.round(n * 100); }
    function formatMoney(cents) {
      const sign = cents < 0 ? "-" : "";
      const value = (Math.abs(cents) / 100).toFixed(2).replace(/\.?0+$/, "");
      return sign + "$" + value;
    }
    function parseAmountToCents(input) {
      const cleaned = String(input).replace(/[$,\s]/g, "").trim();
      if (!cleaned) return null;
      const normalized = cleaned.endsWith(".") ? cleaned.slice(0, -1) : cleaned;
      if (!normalized || !/^\d+(\.\d)?$/.test(normalized)) return null;
      const n = Number(normalized);
      if (!Number.isFinite(n) || n < 0) return null;
      const cents = dollarsToCents(n);
      return cents > dollarsToCents(MAX_AMOUNT) ? null : cents;
    }
    function applyAmountKey(current, key) {
      let value = typeof current === "string" ? current : "";
      if (key === "clear") return { value: "", overLimit: false };
      if (key === "back") return { value: value.slice(0, -1), overLimit: false };
      if (key === ".") {
        if (!value) return { value: "0.", overLimit: false };
        if (value.includes(".")) return { value, overLimit: false };
        return { value: value + ".", overLimit: false };
      }
      if (!/^\d$/.test(key)) return { value, overLimit: false };
      if (!value || value === "0") return { value: key, overLimit: false };
      if (value.includes(".")) {
        const fraction = value.split(".")[1] || "";
        if (fraction.length >= 1) return { value, overLimit: false };
        const next = value + key;
        if (Number(next) > MAX_AMOUNT) return { value, overLimit: true };
        return { value: next, overLimit: false };
      }
      if (value.length >= 4) return { value, overLimit: true };
      return { value: value + key, overLimit: false };
    }
    function sanitizeCustomDenom(raw) {
      const stripped = String(raw || "").replace(/[$,\s]/g, "");
      if (!stripped) return { value: "", overLimit: false };
      let intPart = "";
      let frac = null;
      for (const ch of stripped) {
        if (ch === ".") {
          if (frac !== null) continue;
          frac = "";
          continue;
        }
        if (ch < "0" || ch > "9") continue;
        if (frac !== null) {
          if (frac.length >= 1) continue;
          frac += ch;
        } else if (intPart === "0") intPart = ch;
        else intPart += ch;
      }
      if (!intPart && frac !== null) intPart = "0";
      let value = frac !== null ? `${intPart}.${frac}` : intPart;
      let overLimit = false;
      const numeric = (text) => Number(text.endsWith(".") ? text.slice(0, -1) : text);
      while (value && Number.isFinite(numeric(value)) && numeric(value) > MAX_CUSTOM) {
        overLimit = true;
        value = value.slice(0, -1);
      }
      return { value, overLimit };
    }
    function parseCustomDenomToCents(input) {
      const cents = parseAmountToCents(input);
      if (cents === null || cents === 0 || cents > dollarsToCents(MAX_CUSTOM)) return null;
      return cents;
    }
    function bitCount(n) {
      let bits = n >>> 0, count = 0;
      while (bits) { bits &= bits - 1; count += 1; }
      return count;
    }
    function solve(targetCents, denomCents) {
      const denoms = [...new Set(denomCents.filter((d) => Number.isInteger(d) && d > 0))].sort((a, b) => b - a);
      if (targetCents <= 0 || denoms.length === 0) return null;
      const bits = denoms.map((_, i) => (i < 31 ? 1 << i : 0));
      const dp = new Int32Array(targetCents + 1);
      dp.fill(INF);
      dp[0] = 0;
      for (let amount = 0; amount <= targetCents; amount++) {
        const current = dp[amount];
        if (current === INF) continue;
        for (let i = 0; i < denoms.length; i++) {
          const next = amount + denoms[i];
          if (next > targetCents) continue;
          const candidate = current + 1;
          if (candidate < dp[next]) dp[next] = candidate;
        }
      }
      if (dp[targetCents] === INF) return null;
      const kinds = new Int32Array(targetCents + 1);
      const wholes = new Int32Array(targetCents + 1);
      const parent = new Int32Array(targetCents + 1);
      const used = new Int32Array(targetCents + 1);
      const mask = new Uint32Array(targetCents + 1);
      kinds.fill(INF);
      kinds[0] = 0;
      for (let amount = 0; amount <= targetCents; amount++) {
        const current = dp[amount];
        if (current === INF) continue;
        const currentMask = mask[amount];
        const currentWholes = wholes[amount];
        for (let i = 0; i < denoms.length; i++) {
          const denom = denoms[i];
          const next = amount + denom;
          if (next > targetCents || dp[next] !== current + 1) continue;
          const nextMask = currentMask | bits[i];
          const nextKinds = bitCount(nextMask);
          const nextWholes = currentWholes + (denom % 100 === 0 ? 1 : 0);
          const better =
            nextKinds < kinds[next] ||
            (nextKinds === kinds[next] && nextWholes > wholes[next]) ||
            (nextKinds === kinds[next] && nextWholes === wholes[next] && denom > used[next]);
          if (!better) continue;
          kinds[next] = nextKinds;
          wholes[next] = nextWholes;
          parent[next] = amount;
          used[next] = denom;
          mask[next] = nextMask;
        }
      }
      const counts = new Map();
      let cursor = targetCents, stampCount = 0;
      while (cursor > 0) {
        const denom = used[cursor];
        counts.set(denom, (counts.get(denom) || 0) + 1);
        stampCount += 1;
        cursor = parent[cursor];
      }
      const lines = [...counts.entries()].sort((a, b) => b[0] - a[0]).map(([cents, count]) => ({ cents, count }));
      return { lines, stampCount, totalCents: targetCents };
    }

    function loadSaved() {
      try {
        const parsed = JSON.parse(localStorage.getItem(STORAGE_KEY) || "");
        let amount = "";
        if (typeof parsed.amount === "string") {
          for (const ch of parsed.amount) {
            if (ch >= "0" && ch <= "9") {
              const next = applyAmountKey(amount, ch);
              if (next.overLimit) { amount = next.value; break; }
              amount = next.value;
            } else if (ch === ".") amount = applyAmountKey(amount, ".").value;
          }
        }
        return {
          amount,
          enabled: Array.isArray(parsed.enabled) ? parsed.enabled.filter(Number.isInteger) : [...DEFAULT_CENTS],
          extras: Array.isArray(parsed.extras) ? parsed.extras.filter((n) => Number.isInteger(n) && n > 0 && n <= dollarsToCents(MAX_CUSTOM)) : [],
        };
      } catch {
        return { amount: "", enabled: [...DEFAULT_CENTS], extras: [] };
      }
    }
    function save() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({ amount, enabled, extras }));
    }

    const saved = loadSaved();
    let amount = saved.amount;
    let enabled = saved.enabled;
    let extras = saved.extras;
    let lastPress = 0;
    let toastTimer = 0;
    let comboScale = 1;
    const TAP_SLOP = 12;
    let tapOrigin = null;

    const homeEl = document.getElementById("home");
    const settingsEl = document.getElementById("settings");
    const amountEl = document.getElementById("amount");
    const comboEl = document.getElementById("combo");
    const denomGrid = document.getElementById("denom-grid");
    const extraGrid = document.getElementById("extra-grid");
    const toastEl = document.getElementById("toast");
    const toastMsg = document.getElementById("toast-msg");

    function showPage(name) {
      const settings = name === "settings";
      homeEl.classList.toggle("hidden", settings);
      settingsEl.classList.toggle("hidden", !settings);
      location.hash = settings ? "settings" : "";
      if (settings) renderSettings();
      else renderHome();
    }
    function showToast(message) {
      toastMsg.textContent = message;
      toastEl.classList.add("show");
      toastEl.setAttribute("aria-hidden", "false");
      window.clearTimeout(toastTimer);
      toastTimer = window.setTimeout(() => {
        toastEl.classList.remove("show");
        toastEl.setAttribute("aria-hidden", "true");
      }, 1800);
    }
    function stampHTML(cents, opts) {
      const { count = 1, size = "md", off = false } = opts || {};
      const known = DEFAULT_CENTS.indexOf(cents);
      const custom = known < 0;
      const tone = known >= 0 ? known : 0;
      const hue = custom ? ((Math.imul(cents, 137) >>> 0) % 360) : tone;
      const badge = count > 1
        ? `<span class="badge">×${count}</span>`
        : opts && opts.remove
          ? `<span class="badge remove" aria-hidden="true">−</span>`
          : "";
      const oos = off ? `<span class="oos-tag" aria-hidden="true">缺貨</span>` : "";
      return `<div class="stamp${size === "xs" ? " xs" : ""}${count > 1 || size === "md" ? " pad" : ""}"><div class="stamp-face ${size === "sm" ? "sm" : ""} ${size === "xs" ? "xs" : ""} ${off ? "off" : ""} ${custom ? "custom" : ""}" data-tone="${tone}" style="${custom ? `--hue:${hue}` : ""}"><span>${formatMoney(cents)}</span></div>${oos}${badge}</div>`;
    }
    function pool() {
      return [...new Set([...enabled, ...extras])].sort((a, b) => a - b);
    }
    function renderCombo() {
      const statsEl = document.getElementById("combo-stats");
      const clearStats = () => { statsEl.textContent = "\u00a0"; };
      const target = parseAmountToCents(amount);
      if (!amount || amount === "0" || amount === "0.") {
        comboEl.innerHTML = `<p>請輸入郵費</p>`;
        clearStats();
        return;
      }
      if (target === null) {
        comboEl.innerHTML = `<p>繼續輸入金額…</p>`;
        clearStats();
        return;
      }
      if (pool().length === 0) {
        comboEl.innerHTML = `<p>至少揀一種郵票面額。</p>`;
        clearStats();
        return;
      }
      const combo = target === 0 ? null : solve(target, pool());
      if (!combo) {
        comboEl.innerHTML = `<p>湊唔到剛好呢個金額</p>`;
        clearStats();
        return;
      }
      comboEl.innerHTML = `<div class="cluster">${combo.lines.map((line) => stampHTML(line.cents, { count: line.count })).join("")}</div>`;
      statsEl.textContent = `郵票${combo.stampCount}個\u3000款式${combo.lines.length}種`;
      fitCombo();
    }
    function fitCombo() {
      const cluster = comboEl.querySelector(".cluster");
      if (!cluster) return;
      const next = Math.min(1, comboEl.clientWidth / cluster.offsetWidth, comboEl.clientHeight / cluster.offsetHeight);
      comboScale = Number.isFinite(next) && next > 0 ? next : 1;
      cluster.style.transform = `scale(${comboScale})`;
    }
    function renderHome() {
      amountEl.textContent = amount || "0";
      renderCombo();
      renderStock();
    }
    function renderStock() {
      const stockEl = document.getElementById("stock");
      const cluster = document.getElementById("stock-cluster");
      const missing = DEFAULT_CENTS.filter((cents) => !enabled.includes(cents));
      if (!missing.length && !extras.length) {
        stockEl.classList.remove("show");
        cluster.innerHTML = "";
        return;
      }
      stockEl.classList.add("show");
      const bits = [];
      if (missing.length) {
        const amounts = missing.map(formatMoney).join("、");
        bits.push(`<div class="stock-row oos"><span class="stock-label">缺貨：</span><div class="stock-marquee"><div class="stock-marquee-inner"><span data-probe>${amounts}</span></div></div></div>`);
      }
      if (extras.length) {
        const amounts = extras.map(formatMoney).join("、");
        bits.push(`<div class="stock-row custom"><span class="stock-label">自訂：</span><div class="stock-marquee"><div class="stock-marquee-inner"><span data-probe>${amounts}</span></div></div></div>`);
      }
      cluster.innerHTML = bits.join("");
      requestAnimationFrame(() => {
        cluster.querySelectorAll(".stock-marquee").forEach((wrap) => {
          const inner = wrap.querySelector(".stock-marquee-inner");
          const probe = inner && inner.querySelector("[data-probe]");
          if (!inner || !probe) return;
          const width = probe.scrollWidth;
          if (width <= wrap.clientWidth + 1) return;
          const text = probe.textContent || "";
          inner.innerHTML = `<span data-probe>${text}</span><span aria-hidden="true">${text}</span>`;
          inner.classList.add("marquee-track");
          inner.style.animationDuration = Math.max(8, width / 36) + "s";
        });
      });
    }
    function renderSettings() {
      denomGrid.innerHTML = DEFAULT_CENTS.map((cents) => {
        const on = enabled.includes(cents);
        return `<button type="button" data-toggle="${cents}" aria-pressed="${on}" aria-label="${on ? formatMoney(cents) : formatMoney(cents) + " 缺貨"}">${stampHTML(cents, { size: "sm", off: !on })}</button>`;
      }).join("");
      extraGrid.innerHTML = extras.map((cents) => (
        `<button type="button" data-remove="${cents}" aria-label="移除 ${formatMoney(cents)}">${stampHTML(cents, { size: "sm", remove: true })}</button>`
      )).join("");
      extraGrid.style.display = extras.length ? "" : "none";
    }
    function press(key) {
      const result = applyAmountKey(amount, key === "C" ? "clear" : key);
      if (result.overLimit) {
        showToast("上限為 " + MAX_LABEL);
        return;
      }
      amount = result.value;
      save();
      renderHome();
    }
    function activateTap(el) {
      if (el.hasAttribute("data-go")) {
        showPage(el.getAttribute("data-go"));
        return;
      }
      if (el.hasAttribute("data-key")) {
        press(el.getAttribute("data-key"));
        return;
      }
      if (el.hasAttribute("data-toggle")) {
        const cents = Number(el.getAttribute("data-toggle"));
        enabled = enabled.includes(cents) ? enabled.filter((c) => c !== cents) : [...enabled, cents].sort((a, b) => a - b);
        save();
        renderSettings();
        return;
      }
      if (el.hasAttribute("data-remove")) {
        extras = extras.filter((c) => c !== Number(el.getAttribute("data-remove")));
        save();
        renderSettings();
      }
    }
    const TAP_SEL = "[data-go], [data-key], [data-toggle], [data-remove]";
    document.addEventListener("pointerdown", (event) => {
      if (event.pointerType === "mouse" && event.button !== 0) return;
      const el = event.target.closest(TAP_SEL);
      tapOrigin = el ? { x: event.clientX, y: event.clientY, id: event.pointerId, el } : null;
    });
    document.addEventListener("pointerup", (event) => {
      const start = tapOrigin;
      tapOrigin = null;
      if (!start || start.id !== event.pointerId) return;
      if (event.pointerType === "mouse" && event.button !== 0) return;
      const dx = event.clientX - start.x;
      const dy = event.clientY - start.y;
      if (dx * dx + dy * dy > TAP_SLOP * TAP_SLOP) return;
      const end = event.target.closest(TAP_SEL);
      if (!end || end !== start.el) return;
      lastPress = Date.now();
      activateTap(start.el);
    });
    document.addEventListener("pointercancel", () => { tapOrigin = null; });
    document.addEventListener("click", (event) => {
      if (Date.now() - lastPress < 400) return;
      const el = event.target.closest(TAP_SEL);
      if (!el) return;
      lastPress = Date.now();
      activateTap(el);
    });
    document.getElementById("reset").addEventListener("click", () => {
      enabled = [...DEFAULT_CENTS];
      save();
      renderSettings();
    });
    document.getElementById("reset-extras").addEventListener("click", () => {
      extras = [];
      save();
      renderSettings();
    });
    document.getElementById("custom-form").addEventListener("submit", (event) => {
      event.preventDefault();
      const input = document.getElementById("custom-input");
      const cents = parseCustomDenomToCents(input.value);
      if (cents === null) {
        const attempt = sanitizeCustomDenom(input.value);
        showToast(attempt.overLimit || Number(input.value) > MAX_CUSTOM ? "上限為 $50" : "請輸入有效面額，例如 2.4");
        return;
      }
      if (DEFAULT_CENTS.includes(cents) || extras.includes(cents)) {
        showToast("呢個面額已經有");
        if (!enabled.includes(cents) && DEFAULT_CENTS.includes(cents)) {
          enabled = [...enabled, cents].sort((a, b) => a - b);
          save();
          renderSettings();
        }
        return;
      }
      extras = [...extras, cents].sort((a, b) => a - b);
      input.value = "";
      save();
      renderSettings();
    });
    document.getElementById("custom-input").addEventListener("input", (event) => {
      const result = sanitizeCustomDenom(event.target.value);
      if (result.overLimit) showToast("上限為 $50");
      event.target.value = result.value;
    });
    document.getElementById("theme-btn").addEventListener("click", () => {
      const dark = !document.documentElement.classList.contains("dark");
      document.documentElement.classList.toggle("dark", dark);
      document.documentElement.style.colorScheme = dark ? "dark" : "light";
      try { localStorage.setItem("stamp-calc-theme", dark ? "dark" : "light"); } catch (e) {}
      const meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.setAttribute("content", dark ? "#121a16" : "#009247");
      document.getElementById("theme-btn").setAttribute("aria-label", dark ? "轉淺色" : "轉深色");
    });
    (function syncThemeLabel() {
      const dark = document.documentElement.classList.contains("dark");
      document.getElementById("theme-btn").setAttribute("aria-label", dark ? "轉淺色" : "轉深色");
      const meta = document.querySelector('meta[name="theme-color"]');
      if (meta && dark) meta.setAttribute("content", "#121a16");
    })();
    window.addEventListener("keydown", (event) => {
      if (settingsEl.classList.contains("hidden") === false) return;
      const target = event.target;
      if (target && (target.tagName === "INPUT" || target.tagName === "TEXTAREA")) return;
      if (event.key >= "0" && event.key <= "9") { event.preventDefault(); press(event.key); return; }
      if (event.key === "." || event.key === ",") { event.preventDefault(); press("."); return; }
      if (event.key === "Backspace") { event.preventDefault(); press("back"); return; }
      if (event.key === "Escape" || event.key === "Delete") { event.preventDefault(); press("clear"); }
    });
    window.addEventListener("hashchange", () => {
      showPage(location.hash.replace("#", "") === "settings" ? "settings" : "home");
    });
    window.addEventListener("resize", () => { fitCombo(); renderStock(); });
    (function setupInstall() {
      const btn = document.getElementById("install-btn");
      const sheet = document.getElementById("install-sheet");
      const steps = document.getElementById("install-steps");
      const title = sheet.querySelector("h3");
      const standalone = window.matchMedia("(display-mode: standalone)").matches || Boolean(window.navigator.standalone);
      if (standalone) return;
      btn.classList.add("show");
      const ios = /iPhone|iPad|iPod/i.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
      function waitPrompt(ms) {
        if (window.__pwaDeferred) return Promise.resolve(window.__pwaDeferred);
        return new Promise(function (resolve) {
          var start = Date.now();
          var tick = setInterval(function () {
            if (window.__pwaDeferred) { clearInterval(tick); resolve(window.__pwaDeferred); }
            else if (Date.now() - start >= ms) { clearInterval(tick); resolve(null); }
          }, 80);
        });
      }
      btn.addEventListener("click", async function () {
        if (btn.disabled) return;
        if (ios) {
          title.textContent = "加到 iPhone 主畫面";
          steps.innerHTML = "<li>撳 Safari 底部分享掣</li><li>揀「加到主畫面」</li>";
          sheet.classList.add("show");
          return;
        }
        btn.disabled = true;
        btn.lastChild.textContent = " 安裝中…";
        const event = window.__pwaDeferred || await waitPrompt(1800);
        if (event && event.prompt) {
          await event.prompt();
          const choice = await event.userChoice;
          window.__pwaDeferred = null;
          if (choice && choice.outcome === "accepted") btn.classList.remove("show");
          btn.disabled = false;
          btn.lastChild.textContent = " 一鍵加到桌面";
          return;
        }
        btn.disabled = false;
        btn.lastChild.textContent = " 一鍵加到桌面";
        title.textContent = "請用 Chrome 開啟再撳一次";
        steps.innerHTML = "<li>用 Chrome 打開呢個網址</li><li>再撳「一鍵加到桌面」，就會彈出安裝</li>";
        sheet.classList.add("show");
      });
      document.getElementById("install-close").addEventListener("click", () => {
        sheet.classList.remove("show");
      });
      window.addEventListener("appinstalled", () => btn.classList.remove("show"));
    })();
    showPage(location.hash.replace("#", "") === "settings" ? "settings" : "home");
  </script>
</body>
</html>
